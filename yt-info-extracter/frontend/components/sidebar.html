<!-- Slidable ChatGPT Sidebar Component with Mini-Rail Icons -->
<aside 
  id="sidebar" 
  class="w-[280px] min-w-[280px] max-w-[280px] h-full bg-chatgpt-sidebar border-r border-chatgpt-borderSubtle flex flex-col z-30 transition-all duration-300 ease-in-out select-none shrink-0"
>
  <!-- Mini-Rail Mode (Icons Only when Collapsed - ChatGPT style) -->
  <div class="sidebar-mini-rail w-full h-full flex flex-col items-center py-3 gap-3 bg-chatgpt-sidebar">
    <button id="mini-sidebar-expand-btn" class="p-2.5 rounded-xl text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-all" title="Expand Sidebar (Ctrl+B)">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
      </svg>
    </button>
    <button id="mini-new-chat-btn" class="p-2.5 rounded-xl text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 transition-all" title="New Research Chat (Ctrl+N)">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>
    <button id="mini-load-video-btn" class="p-2.5 rounded-xl text-rose-400 hover:text-white hover:bg-chatgpt-surface transition-all" title="Index YouTube Video">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
      </svg>
    </button>
    <button id="mini-chats-btn" class="p-2.5 rounded-xl text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-all" title="Recent Chats">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <button id="mini-videos-btn" class="p-2.5 rounded-xl text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-all" title="Saved Videos Library">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="18" height="14" x="3" y="5" rx="2"/>
        <polyline points="3 7 12 13 21 7"/>
      </svg>
    </button>
  </div>

  <!-- Full Sidebar Content -->
  <div class="sidebar-full-content w-full h-full flex flex-col overflow-hidden">
    <!-- Sidebar Header & New Chat Action -->
    <div class="p-3 border-b border-chatgpt-borderSubtle flex items-center justify-between gap-2">
      <button id="new-chat-btn" class="flex-1 flex items-center justify-between px-3 py-2 text-xs font-semibold rounded-lg bg-chatgpt-surface hover:bg-chatgpt-surfaceHover text-chatgpt-textPrimary border border-chatgpt-border transition-all group">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-chatgpt-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>New Research Chat</span>
        </div>
        <span class="text-[10px] text-chatgpt-textMuted group-hover:text-chatgpt-textSecondary">Ctrl+N</span>
      </button>

      <!-- Sidebar Collapse Button -->
      <button id="sidebar-close-btn" class="p-2 rounded-lg text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-colors" title="Collapse sidebar (Ctrl+B)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M9 3v18" />
        </svg>
      </button>
    </div>

    <!-- YouTube URL Input in Sidebar -->
    <div class="px-3 py-2 border-b border-chatgpt-borderSubtle bg-chatgpt-sidebar/50">
      <div class="flex items-center gap-1.5 bg-chatgpt-surface rounded-xl p-1 border border-chatgpt-border focus-within:border-chatgpt-accent transition-colors">
        <input 
          type="text" 
          id="video-url-input" 
          placeholder="Paste YouTube URL..." 
          class="flex-1 bg-transparent px-2.5 py-1 text-xs text-white placeholder:text-chatgpt-textMuted focus:outline-none min-w-0"
          autocomplete="off"
          spellcheck="false"
        />
        <button 
          id="load-video-btn" 
          class="px-2.5 py-1 bg-chatgpt-accent hover:bg-chatgpt-accentHover text-white text-xs font-semibold rounded-lg transition-all flex items-center gap-1 shrink-0 shadow-sm"
          title="Fetch transcript and index video"
        >
          <span class="btn-text">Load</span>
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Current Video Card (if loaded) -->
    <div id="current-video-card" class="p-3 m-2.5 rounded-xl bg-chatgpt-card border border-chatgpt-border hidden flex flex-col gap-2">
      <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-black border border-white/5 group">
        <img id="current-video-thumb" src="" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
        <span class="absolute bottom-1.5 right-1.5 px-1.5 py-0.5 rounded text-[10px] font-semibold bg-black/80 text-emerald-400 backdrop-blur-sm border border-white/10">Active Video</span>
      </div>
      <div class="flex flex-col gap-1">
        <h4 id="current-video-title" class="text-xs font-semibold text-white line-clamp-2 leading-snug">Video Title</h4>
        <a id="current-video-link" href="#" target="_blank" class="inline-flex items-center gap-1 text-[11px] text-chatgpt-textMuted hover:text-chatgpt-accent transition-colors">
          <span>Watch on YouTube</span>
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- Chat History Section (Flexible Height) -->
    <div id="chat-history-section" class="flex-1 flex flex-col overflow-hidden px-2 pt-2 min-h-[100px]">
      <div class="flex items-center justify-between px-2 py-1 text-[11px] font-semibold uppercase tracking-wider text-chatgpt-textMuted">
        <span>Recent Chats</span>
        <span id="chat-count-badge" class="px-1.5 py-0.2 rounded-full bg-chatgpt-surface text-chatgpt-textSecondary text-[10px]">0</span>
      </div>
      <div id="chat-list" class="flex-1 overflow-y-auto space-y-0.5 pr-1 mt-1 text-xs">
        <div class="p-3 text-center text-chatgpt-textMuted text-xs">No chats yet for this video</div>
      </div>
    </div>

    <!-- Horizontal Resizer Gutter between Chats and Video Library -->
    <div id="sidebar-vertical-resizer" class="sidebar-resizer-gutter" title="Drag to resize chat history and video library">
      <div class="sidebar-resizer-handle-line"></div>
    </div>

    <!-- Indexed Videos Library (Resizable Height with Delete Button) -->
    <div id="video-library-section" class="flex flex-col overflow-hidden px-2 pt-2 h-[200px] min-h-[110px] max-h-[380px]">
      <div class="flex items-center justify-between px-2 py-1 text-[11px] font-semibold uppercase tracking-wider text-chatgpt-textMuted">
        <span>Saved Videos Library</span>
        <span id="video-count-badge" class="px-1.5 py-0.2 rounded-full bg-chatgpt-surface text-chatgpt-textSecondary text-[10px]">0</span>
      </div>
      <div id="video-library-list" class="flex-1 overflow-y-auto space-y-1 pr-1 mt-1">
        <!-- Populated dynamically with delete option -->
      </div>
    </div>
  </div>
</aside>

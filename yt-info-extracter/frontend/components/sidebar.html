<!-- Slidable ChatGPT Sidebar Component -->
<aside 
  id="sidebar" 
  class="w-[280px] min-w-[280px] max-w-[280px] h-full bg-chatgpt-sidebar border-r border-chatgpt-borderSubtle flex flex-col z-30 transition-all duration-300 ease-in-out select-none shrink-0"
>
  <!-- Sidebar Header & New Chat Action -->
  <div class="p-3 border-b border-chatgpt-borderSubtle flex items-center justify-between gap-2">
    <button id="new-chat-btn" class="flex-1 flex items-center justify-between px-3 py-2 text-xs font-semibold rounded-lg bg-chatgpt-surface hover:bg-chatgpt-surfaceHover text-chatgpt-textPrimary border border-chatgpt-border transition-all group">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-chatgpt-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span>New Research Chat</span>
      </div>
      <span class="text-[10px] text-chatgpt-textMuted group-hover:text-chatgpt-textSecondary">Ctrl+N</span>
    </button>

    <!-- Sidebar Collapse Button -->
    <button id="sidebar-close-btn" class="p-2 rounded-lg text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-colors" title="Close sidebar (Ctrl+B)">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
      </svg>
    </button>
  </div>

  <!-- Current Video Card (if loaded) -->
  <div id="current-video-card" class="p-3 m-2.5 rounded-xl bg-chatgpt-card border border-chatgpt-border hidden flex flex-col gap-2">
    <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-black border border-white/5 group">
      <img id="current-video-thumb" src="" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
      <span class="absolute bottom-1.5 right-1.5 px-1.5 py-0.5 rounded text-[10px] font-semibold bg-black/80 text-emerald-400 backdrop-blur-sm border border-white/10">Active Video</span>
    </div>
    <div class="flex flex-col gap-1">
      <h4 id="current-video-title" class="text-xs font-semibold text-white line-clamp-2 leading-snug">Video Title</h4>
      <a id="current-video-link" href="#" target="_blank" class="inline-flex items-center gap-1 text-[11px] text-chatgpt-textMuted hover:text-chatgpt-accent transition-colors">
        <span>Watch on YouTube</span>
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Chat History Section -->
  <div class="flex-1 flex flex-col overflow-hidden px-2 pt-2">
    <div class="flex items-center justify-between px-2 py-1 text-[11px] font-semibold uppercase tracking-wider text-chatgpt-textMuted">
      <span>Recent Chats</span>
      <span id="chat-count-badge" class="px-1.5 py-0.2 rounded-full bg-chatgpt-surface text-chatgpt-textSecondary text-[10px]">0</span>
    </div>
    <div id="chat-list" class="flex-1 overflow-y-auto space-y-0.5 pr-1 mt-1 text-xs">
      <div class="p-3 text-center text-chatgpt-textMuted text-xs">No chats yet for this video</div>
    </div>
  </div>

  <!-- Indexed Videos Library -->
  <div class="h-44 border-t border-chatgpt-borderSubtle flex flex-col overflow-hidden px-2 pt-2">
    <div class="flex items-center justify-between px-2 py-1 text-[11px] font-semibold uppercase tracking-wider text-chatgpt-textMuted">
      <span>Saved Videos Library</span>
      <span id="video-count-badge" class="px-1.5 py-0.2 rounded-full bg-chatgpt-surface text-chatgpt-textSecondary text-[10px]">0</span>
    </div>
    <div id="video-library-list" class="flex-1 overflow-y-auto space-y-1 pr-1 mt-1">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- User / Model Footer -->
  <div class="p-3 border-t border-chatgpt-borderSubtle flex items-center justify-between bg-chatgpt-sidebar/50">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-full bg-chatgpt-surface flex items-center justify-center text-white text-xs font-bold border border-chatgpt-border">
        YR
      </div>
      <div class="flex flex-col">
        <span class="text-xs font-medium text-white">YouTube Researcher</span>
        <span class="text-[10px] text-chatgpt-textMuted">Groq + FAISS RAG</span>
      </div>
    </div>
    <div class="w-2 h-2 rounded-full bg-chatgpt-accent" title="AI Pipeline Ready"></div>
  </div>
</aside>

<!-- Top Navigation Bar Component -->
<header class="h-16 md:h-[72px] bg-chatgpt-main/95 backdrop-blur-md border-b border-chatgpt-borderSubtle flex items-center justify-between px-5 z-40 gap-4 shrink-0 shadow-sm">
  <div class="flex items-center gap-3.5">
    <!-- Sidebar Toggle Button (ChatGPT style) -->
    <button id="sidebar-toggle-btn" class="p-2.5 rounded-xl text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-all" title="Toggle sidebar (Ctrl+B)">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
      </svg>
    </button>

    <!-- Brand Logo -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-chatgpt-accent to-emerald-400 flex items-center justify-center text-white shadow-md shadow-emerald-900/40 shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2">
        <span class="font-bold text-base tracking-tight text-white leading-tight">YouTube Researcher</span>
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 w-fit">LangGraph 3.3</span>
      </div>
    </div>
  </div>

  <!-- YouTube Video Input Bar in Header -->
  <div class="flex-1 max-w-2xl mx-2">
    <div class="relative flex items-center">
      <svg class="w-4 h-4 absolute left-4 text-chatgpt-textMuted pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input 
        type="text" 
        id="video-url-input" 
        placeholder="Paste any YouTube URL (e.g. https://www.youtube.com/watch?v=...)" 
        class="w-full bg-chatgpt-sidebar border border-chatgpt-border rounded-full pl-11 pr-32 py-2 text-sm text-chatgpt-textPrimary placeholder:text-chatgpt-textMuted focus:outline-none focus:border-chatgpt-accent focus:ring-1 focus:ring-chatgpt-accent transition-all shadow-inner"
        autocomplete="off"
        spellcheck="false"
      />
      <button 
        id="load-video-btn" 
        class="absolute right-1.5 px-3.5 py-1.5 bg-chatgpt-accent hover:bg-chatgpt-accentHover text-white text-xs font-semibold rounded-full transition-all flex items-center gap-1.5 shadow-md shadow-emerald-900/50"
        title="Fetch transcript, extract timestamps & build FAISS vector index"
      >
        <span class="btn-text">Index Video</span>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Right Header Controls -->
  <div class="flex items-center gap-2.5">
    <!-- View Tabs: Workspace vs Compare -->
    <div class="flex items-center bg-chatgpt-sidebar p-1 rounded-xl border border-chatgpt-borderSubtle">
      <button id="tab-btn-workspace" class="px-3.5 py-1.5 text-xs font-medium rounded-lg text-white bg-chatgpt-surface shadow-sm transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M9 3v18" />
        </svg>
        <span>Workspace</span>
      </button>
      <button id="tab-btn-compare" class="px-3.5 py-1.5 text-xs font-medium rounded-lg text-chatgpt-textSecondary hover:text-white transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 3h5v5" />
          <path d="M8 3H3v5" />
          <path d="M12 21V3" />
          <path d="m3 8 7 7" />
          <path d="m21 8-7 7" />
        </svg>
        <span>Compare</span>
      </button>
    </div>

    <!-- Toggle Video Dock Button -->
    <button id="toggle-video-panel-btn" class="p-2.5 rounded-xl text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-colors" title="Toggle Video Player Dock">
      <svg class="w-4 h-4 text-rose-400" viewBox="0 0 24 24" fill="currentColor">
        <path d="m22 8-6 4 6 4V8Z"/>
        <rect width="14" height="12" x="2" y="6" rx="2"/>
      </svg>
    </button>

    <!-- Online Indicator -->
    <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Online</span>
    </div>
  </div>
</header>

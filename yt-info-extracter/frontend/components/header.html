<!-- Top Navigation Bar Component -->
<header class="h-16 md:h-[72px] bg-chatgpt-main/95 backdrop-blur-md border-b border-chatgpt-borderSubtle flex items-center justify-between px-5 z-40 gap-4 shrink-0 shadow-sm">
  <div class="flex items-center gap-3.5">
    <!-- Brand Logo -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-chatgpt-accent to-emerald-400 flex items-center justify-center text-white shadow-md shadow-emerald-900/40 shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2">
        <span class="font-bold text-base tracking-tight text-white leading-tight">YouTube Researcher</span>
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 w-fit">LangGraph 3.3</span>
      </div>
    </div>
  </div>

  <!-- Header Center / Clean Title & Quick Video Action -->
  <div class="flex-1 flex justify-center max-w-md mx-2">
    <button id="header-load-video-modal-btn" class="px-3.5 py-1.5 rounded-full bg-chatgpt-surface/90 hover:bg-chatgpt-surfaceHover border border-white/10 text-chatgpt-textSecondary hover:text-white text-xs font-medium transition-all flex items-center gap-2 shadow-sm" title="Index a YouTube Video">
      <svg class="w-3.5 h-3.5 text-rose-500" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
      </svg>
      <span>Index YouTube Video</span>
    </button>
  </div>

  <!-- Right Header Controls -->
  <div class="flex items-center gap-2.5">
    <!-- View Tabs: Workspace vs Compare -->
    <div class="flex items-center bg-chatgpt-sidebar p-1 rounded-xl border border-chatgpt-borderSubtle">
      <button id="tab-btn-workspace" class="px-3.5 py-1.5 text-xs font-medium rounded-lg text-white bg-chatgpt-surface shadow-sm transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M9 3v18" />
        </svg>
        <span>Workspace</span>
      </button>
      <button id="tab-btn-compare" class="px-3.5 py-1.5 text-xs font-medium rounded-lg text-chatgpt-textSecondary hover:text-white transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 3h5v5" />
          <path d="M8 3H3v5" />
          <path d="M12 21V3" />
          <path d="m3 8 7 7" />
          <path d="m21 8-7 7" />
        </svg>
        <span>Compare</span>
      </button>
    </div>

    <!-- Toggle Video Dock Button -->
    <button id="toggle-video-panel-btn" class="p-2.5 rounded-xl text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-colors" title="Toggle Video Player Dock">
      <svg class="w-4 h-4 text-rose-400" viewBox="0 0 24 24" fill="currentColor">
        <path d="m22 8-6 4 6 4V8Z"/>
        <rect width="14" height="12" x="2" y="6" rx="2"/>
      </svg>
    </button>

    <!-- Theme & Glass Customizer Button -->
    <button id="theme-customizer-btn" class="px-2.5 py-1.5 rounded-xl text-chatgpt-textSecondary hover:text-white hover:bg-chatgpt-surface transition-all flex items-center gap-1.5 border border-white/5" title="Customize Darkness & Glassmorphism">
      <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="hidden md:inline text-xs font-medium">Theme</span>
    </button>

    <!-- Online Indicator -->
    <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Online</span>
    </div>
  </div>
</header>

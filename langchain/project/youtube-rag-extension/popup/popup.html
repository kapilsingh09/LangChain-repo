<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube RAG Chatbot</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>YouTube RAG</h1>
      <button id="reset-btn" class="icon-btn" title="Reset Conversation">↺</button>
    </header>
    
    <div id="status-container" class="status-box">
      <img id="video-thumbnail" src="" alt="Video Thumbnail" style="display: none; width: 100%; border-radius: 6px; margin-bottom: 8px;">
      <p id="video-title">Detecting video...</p>
    </div>

    <div class="chat-container">
      <div id="chat-history" class="chat-history">
        <!-- Messages will appear here -->
      </div>
    </div>

    <div class="input-container">
      <input type="text" id="question-input" placeholder="Ask about this video..." disabled />
      <button id="ask-btn" disabled>Ask</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
